# Container's Mesa is too old for modern GPUs (RDNA3, etc.)
SOFTWARE_GL=1

# Force mouse grab for proper FPS input capture
GAMESCOPE_ARGS="--force-grab-cursor"

GAMESCOPE_WIDTH=1600
GAMESCOPE_HEIGHT=1200

# Workaround for init race condition under gamescope
USE_STRACE=1

# Bundled OpenAL uses /dev/dsp - padsp intercepts for PulseAudio
USE_PADSP=1

# WON CD key validation can't persist the key, auto-type it on each launch
PRE_LAUNCH="(xdotool search --sync --name 'SoF' windowfocus --sync; sleep 2; xdotool type --delay 100 'BEN6-MUC8-BEZ6-BUJ6-3764'; sleep 1; xdotool key Return) &"
