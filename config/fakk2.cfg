# Container's Mesa is too old for modern GPUs (RDNA3, etc.)
SOFTWARE_GL=1

GAMESCOPE_ARGS="--force-grab-cursor"

GAMESCOPE_WIDTH=1600
GAMESCOPE_HEIGHT=1200

# Workaround for init race condition under gamescope
USE_STRACE=1

# Quake 3 engine uses OSS audio - padsp intercepts for PulseAudio
USE_PADSP=1

# Replace bundled libGL.so with system Mesa (game does dlopen("./libGL.so"))
PRE_LAUNCH="ln -sf /usr/lib/i386-linux-gnu/mesa/libGL.so.1 libGL.so"

# Run binary directly - bundled libz.so.1.1.4 breaks Mesa's swrast_dri.so
# Force fullscreen + disable DGA mouse (incompatible with gamescope's Xwayland)
LAUNCH_CMD="./fakk2 +set r_mode 9 +set r_fullscreen 1 +set in_dgamouse 0"
