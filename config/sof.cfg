# Container's Mesa is too old for modern GPUs (RDNA3, etc.)
SOFTWARE_GL=1

# Force mouse grab for proper FPS input capture
GAMESCOPE_ARGS="--force-grab-cursor"

GAMESCOPE_WIDTH=1024
GAMESCOPE_HEIGHT=768

# Workaround for init race condition under gamescope
USE_STRACE=1

# Bundled OpenAL uses /dev/dsp - padsp intercepts for PulseAudio
USE_PADSP=1

# Match game resolution to gamescope (ResHook.so patches vid_modes[3])
# Auto-type CD key on first launch (no paste support in game window)
PRE_LAUNCH="export SOF_WIDTH=1024 SOF_HEIGHT=768; if [ ! -s ~/.loki/sof/won_key ]; then (xdotool search --sync --name 'SoF' windowfocus --sync; sleep 2; xdotool type --delay 100 'BEN6-MUC8-BEZ6-BUJ6-3764'; sleep 1; xdotool key Return) & fi"
