# Container's Mesa is too old for modern GPUs (RDNA3, etc.)
SOFTWARE_GL=1

# ETQW (2007) needs GL extensions beyond year 2000 default
MESA_YEAR=2008

GAMESCOPE_ARGS="--force-grab-cursor"

GAMESCOPE_WIDTH=2560
GAMESCOPE_HEIGHT=1440

# Workaround for init race condition under gamescope
USE_STRACE=1

# id Tech 4 engine - padsp intercepts for PulseAudio
USE_PADSP=1

# Persist game config/saves (not under .loki)
SAVE_DIRS=("${HOME}/.etqwcl:/home/loki/.etqwcl")

# Bundled libstdc++/libgcc_s break Mesa's LLVM - remove them so system libs are used
PRE_LAUNCH="rm -f libstdc++.so.6 libgcc_s.so.1"

# Run binary directly with only libCgx86.so in LD_LIBRARY_PATH
LAUNCH_CMD="./etqw.x86"
