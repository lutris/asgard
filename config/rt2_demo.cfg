# Statically linked - no library interception possible
USE_PADSP=0

GAMESCOPE_WIDTH=1024
GAMESCOPE_HEIGHT=768

# Static SDL only supports OSS audio - use onboard audio (card 2) instead of
# default /dev/dsp which maps to Scarlett Solo (card 0, wrong format support)
# --privileged exposes all devices, so just set SDL_PATH_DSP to the right one
EXTRA_ENV="SDL_PATH_DSP=/dev/dsp2"

LAUNCH_CMD="./rt2_demo.x86"
