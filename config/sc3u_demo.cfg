# Game uses Loki_Compat libs (own ld-linux.so.2), padsp can't intercept
USE_PADSP=0

# Loki_Compat's old ld-linux.so.2 (glibc 2.2.5) is incompatible with ptrace,
# so we can't use strace. Use sleep instead for gamescope race condition.
USE_STRACE=0
PRE_LAUNCH="unset LD_LIBRARY_PATH; sleep 2; export LD_LIBRARY_PATH=Loki_Compat:lib"

# Bypass arch-detection wrapper (uname -m returns x86_64 from host kernel)
LAUNCH_CMD="Loki_Compat/ld-linux.so.2 ./sc3u_demo.x86"
