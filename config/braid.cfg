# Braid handles its own fullscreen/windowing
USE_GAMESCOPE=0

# Braid needs GL extensions from 2002+ (ARB_vertex_program, ARB_fragment_program)
MESA_YEAR=2010

# Container's Mesa is too old for modern GPUs (RDNA3, etc.)
SOFTWARE_GL=1

# Workaround for fullscreen init race condition
USE_STRACE=1

# Braid uses SDL2 audio, not OSS
USE_PADSP=0

# Game save/config directory
SAVE_DIRS=("${HOME}/.braid:/home/loki/.Braid")

# Native resolution
GAMESCOPE_WIDTH=1280
GAMESCOPE_HEIGHT=720
