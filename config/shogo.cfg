# Container's Mesa is too old for modern GPUs (RDNA3, etc.)
SOFTWARE_GL=1

# Bundled SDL 1.1 uses DGA/VidMode which crashes gamescope's Xwayland
USE_GAMESCOPE=0

# Dynamically linked - padsp intercepts audio calls
USE_PADSP=1

# Symlink CD mount into game directory (game expects ./cdrom)
PRE_LAUNCH="ln -sf /mnt/shogocd cdrom"

# Mount the game CD
SAVE_DIRS=("/run/media/strider/Shogo:/mnt/shogocd")
