USE_GAMESCOPE=1

# Container's Mesa is too old for modern GPUs (RDNA3, etc.)
SOFTWARE_GL=1

# Need GL extensions beyond year 2000
MESA_YEAR=2010

# Game bundles old libstdc++/libgcc that break Mesa's DRI driver loading
PRE_LAUNCH="rm -f libstdc++.so.6 libgcc_s.so.1"

# Workaround for init race condition under gamescope
USE_STRACE=1

# SDL 1.2 handles audio natively (ALSA/PulseAudio)
USE_PADSP=0

# Game save/config directory
SAVE_DIRS=("${HOME}/.aquaria:/home/loki/.Aquaria")
